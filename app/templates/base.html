<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeneradorContenido{% endblock %}</title>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="nav" x-data="{ open: false }">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                GeneradorContenido
            </a>

            <button class="nav-toggle" @click="open = !open" :aria-expanded="open">
                <svg x-show="!open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <svg x-show="open" x-cloak viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="nav-links" :class="{ 'open': open }" @click.away="open = false">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/settings" class="nav-link {% if request.url.path == '/settings' %}active{% endif %}">Configuracion</a>
                {% if pending_count is defined and pending_count > 0 %}
                <a href="/content?status=pending_approval" class="nav-link">
                    Pendientes <span class="badge-count">{{ pending_count }}</span>
                </a>
                {% endif %}
                <a href="/bots/new" class="nav-link nav-cta">+ Nuevo Bot</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block breadcrumbs %}{% endblock %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <small>GeneradorContenido v0.1.0</small>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
