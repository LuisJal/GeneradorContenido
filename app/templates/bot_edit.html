{% extends "base.html" %}

{% block title %}Editar {{ bot.name }} - GeneradorContenido{% endblock %}

{% block content %}
<h1>Editar {{ bot.name }}</h1>

{% if errors.get("general") %}
<article class="error">
    <p><strong>Error:</strong> {{ errors.general }}</p>
</article>
{% endif %}

<form method="post" action="/bots/{{ bot.slug }}/edit">
    <fieldset>
        <legend>Contenido</legend>

        <label for="niche_description">Descripcion del nicho</label>
        <textarea id="niche_description" name="niche_description" rows="3">{{ bot.niche_description }}</textarea>

        <label for="content_style">Estilo de contenido</label>
        <input type="text" id="content_style" name="content_style" value="{{ bot.content_style }}">

        <label for="script_system_prompt">System prompt para guiones</label>
        <textarea id="script_system_prompt" name="script_system_prompt" rows="5">{{ bot.script_system_prompt }}</textarea>

        <label for="language">Idioma</label>
        <select id="language" name="language">
            <option value="es" {{ "selected" if bot.language == "es" }}>Espanol</option>
            <option value="en" {{ "selected" if bot.language == "en" }}>English</option>
        </select>
    </fieldset>

    <fieldset>
        <legend>Video</legend>

        <label for="video_provider">Proveedor</label>
        <select id="video_provider" name="video_provider">
            <option value="veo3" {{ "selected" if bot.video_provider == "veo3" }}>Google Veo 3</option>
            <option value="kling3" {{ "selected" if bot.video_provider == "kling3" }}>Kling 3.0</option>
        </select>

        <label for="video_duration_seconds">Duracion (segundos)</label>
        <input type="number" id="video_duration_seconds" name="video_duration_seconds" value="{{ bot.video_duration_seconds }}" min="5" max="60">

        <label for="videos_per_day">Videos por dia</label>
        <input type="number" id="videos_per_day" name="videos_per_day" value="{{ bot.videos_per_day }}" min="1" max="10">
    </fieldset>

    <fieldset>
        <legend>Programacion</legend>

        <label for="schedule_times">Horarios</label>
        <input type="text" id="schedule_times" name="schedule_times" value="{{ bot.posting_schedule.get('times', ['09:00']) | join(', ') }}">

        <label for="schedule_timezone">Zona horaria</label>
        <input type="text" id="schedule_timezone" name="schedule_timezone" value="{{ bot.posting_schedule.get('timezone', 'Europe/Madrid') }}">

        <label for="use_trends">
            <input type="checkbox" id="use_trends" name="use_trends" {{ "checked" if bot.use_trends }}>
            Usar scraping de tendencias
        </label>
    </fieldset>

    <fieldset>
        <legend>APIs</legend>

        <label for="gemini_api_key">Gemini API Key (dejar vacia para no cambiar)</label>
        <input type="password" id="gemini_api_key" name="gemini_api_key" placeholder="Dejar vacio para mantener la actual">

        <label for="telegram_chat_id">Telegram Chat ID</label>
        <input type="text" id="telegram_chat_id" name="telegram_chat_id" value="{{ bot.telegram_chat_id or '' }}">

        <label for="contact_email">Email</label>
        <input type="email" id="contact_email" name="contact_email" value="{{ bot.contact_email or '' }}">
    </fieldset>

    <button type="submit">Guardar cambios</button>
    <a href="/bots/{{ bot.slug }}" role="button" class="secondary outline">Cancelar</a>
</form>
{% endblock %}
