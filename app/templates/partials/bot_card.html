<article class="bot-card">
    <header>
        <hgroup>
            <h3><a href="/bots/{{ bot.slug }}">{{ bot.name }}</a></h3>
            <p>{{ bot.niche }}
                {% if bot.is_enabled %}
                <span class="badge-active">Activo</span>
                {% else %}
                <span class="badge-inactive">Inactivo</span>
                {% endif %}
            </p>
        </hgroup>
    </header>

    {% if bot.niche_description %}
    <p class="truncate">{{ bot.niche_description[:120] }}{% if bot.niche_description|length > 120 %}...{% endif %}</p>
    {% endif %}

    <footer>
        <a href="/bots/{{ bot.slug }}" role="button" class="outline">Gestionar</a>
    </footer>
</article>
