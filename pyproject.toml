[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-contenido"
version = "0.1.0"
description = "Sistema multi-bot de generacion autonoma de contenido para redes sociales"
requires-python = ">=3.9"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # HTTP Client
    "httpx>=0.28.0",

    # Google APIs
    "google-genai>=1.0.0",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.37.0",
    "google-auth-oauthlib>=1.2.0",

    # Telegram
    "python-telegram-bot>=22.0",

    # Security
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.0",

    # Resilience
    "tenacity>=9.0.0",

    # Data Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Scraping
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
